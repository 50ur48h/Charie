# The one-command demo: `docker compose up --build`, then open http://localhost:3000.
# Needs only META_API_KEY, in a .env file beside this one (see .env.example).
name: charie-demo

services:
  app:
    build: .
    image: charie:demo
    ports:
      - "${CHARIE_PORT:-3000}:3000"
    volumes:
      # Charie's own database, keys and results, kept between restarts.
      - app-data:/app/ops
    environment:
      META_API_KEY: ${META_API_KEY:?Set META_API_KEY in .env - see .env.example}

volumes:
  app-data:
