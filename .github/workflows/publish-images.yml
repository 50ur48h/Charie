# Builds Charie's single image and pushes it to GitHub Container Registry.
name: publish-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/charie"
          echo "list=$image:latest,$image:${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=charie
          cache-from: type=gha,scope=charie
          cache-to: type=gha,mode=max,scope=charie
      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          {
            echo "### Image pushed"
            echo
            IFS=',' read -ra list <<< "$TAGS"
            for tag in "${list[@]}"; do echo "- $tag"; done
          } >> "$GITHUB_STEP_SUMMARY"
