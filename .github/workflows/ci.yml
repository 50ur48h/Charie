# CI v1 (plan §4.1, WP0.5).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      smoke: ${{ steps.filter.outputs.smoke }}
      connectors: ${{ steps.filter.outputs.connectors }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'ops/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # The compose smoke drives both halves at once, so it is the one job
            # that would notice them disagreeing — and the only one for which a
            # change to the compose file or the seed is a reason to run.
            smoke:
              - 'apps/web/**'
              - 'apps/api/**'
              - 'ops/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
            connectors:
              - 'apps/api/src/charie/connectors/**'
              - 'apps/api/src/charie/dal/**'
              - 'apps/api/tests/connectors/**'
              - 'ops/seed/seed_pizza_mssql.sql'
              - 'ops/scripts/seed_mssql.sh'
              - '.github/workflows/ci.yml'

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Every TODO has a backlog ID
        run: bash scripts/check_todos.sh
      # The half of the role check that needs no Azure (B-130).
      - name: The role ids and the secret-scanner allowlist agree
        run: sh ops/scripts/check_role_definitions.sh --allowlist-only
      # The workflows are the one kind of code here that nothing could run before it ran in...
      - name: Lint the workflows, with shellcheck over every `run:` block
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo             rhysd/actionlint:latest@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667             -color
      # Check environment correspondence and the guard itself.
      - name: The environment guard still catches a variable that reaches nothing
        run: bash scripts/check_env.sh --selftest
      - name: .env.example and compose agree about what the container gets
        run: bash scripts/check_env.sh
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The guard on the guard.
      - name: preflight still covers every step this file runs
        run: uv run --directory apps/api python ../../scripts/check_preflight.py --selftest && uv run --directory apps/api python ../../scripts/check_preflight.py
      - name: Seed truths match the generator
        run: make check.truths

  api:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.api }}
      # Migration and isolation tests need a real server.
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
      # The unprivileged role the RLS proof suite connects as.
      APP_DATABASE_URL: postgresql+asyncpg://charie_app:apptest@localhost:5432/postgres
      REQUIRE_DB: "1"
      # This job measures everything except the SQL Server connector, which it cannot reach.
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.api
    services:
      # pgvector, not plain postgres: revision 0001 creates the vector extension.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        if: env.RUN == 'true'
        run: uv sync --locked --directory apps/api
      - name: Lint, typecheck, test
        if: env.RUN == 'true'
        run: make lint.api lint.seed typecheck.api test.api
      # Its own step so the tenant-isolation proof is a named signal in the log rather than a...
      - name: Tenant isolation proof (may never be skipped)
        if: env.RUN == 'true'
        run: make test.rls
      # Its own step, and its own gate, for the same reason the RLS proof has one.
      - name: DAL suite and its coverage gate
        if: env.RUN == 'true'
        env:
          # Its own data file.
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.dal-gate
        run: make test.dal
      - name: Keep this job's half of the coverage data
        if: env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: .coverage.api
          retention-days: 1
          # Coverage data files start with a dot.
          include-hidden-files: true
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No changes under apps/api or ops — skipping."

  # The second dialect, against a real SQL Server (WP3.3).
  mssql:
    needs: changes
    if: needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    # The heaviest job here, and the only one that installs from a third-party apt repository.
    timeout-minutes: 20
    env:
      # A throwaway for a container that lives for one job and listens on localhost.
      MSSQL_SA_PASSWORD: Ci_only_password_1
      MSSQL_PIZZA_READONLY_PASSWORD: Ci_only_readonly_1
      MSSQL_HOST: localhost
      MSSQL_PORT: "1433"
      MSSQL_DB: pizza
      MSSQL_PIZZA_READONLY_USER: pizza_readonly
      # The connector suite skips when no server is reachable.
      REQUIRE_MSSQL: "1"
      # Postgres fixtures are not part of this job.
      REQUIRE_DB: "0"
      # This is the only job that can execute connectors/sqlserver.py.
      COVERAGE_FILE: ${{ github.workspace }}/.coverage.mssql
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci_only_password_1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_only_password_1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # The same script the image uses.
      - name: Install the SQL Server ODBC driver
        # Its own, tighter ceiling: the job's 20 minutes would be spent here and report "the job...
        timeout-minutes: 8
        run: sudo KEEP_BUILD_TOOLS=1 sh apps/api/docker/install-odbc.sh
      - name: Install
        run: uv sync --locked --directory apps/api
      # -i so the redirected file becomes the container's stdin.
      - name: Seed the SQL Server fixture
        run: |
          docker exec -i \
            -e RO_PASSWORD="$MSSQL_PIZZA_READONLY_PASSWORD" \
            "${{ job.services.mssql.id }}" \
            sh -c 'exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -v ReadonlyPassword="$RO_PASSWORD"' \
            < ops/seed/seed_pizza_mssql.sql
      - name: Connector tests (may not skip here)
        run: uv run --directory apps/api pytest tests/connectors -q --cov
      - name: Keep this job's half of the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mssql
          path: .coverage.mssql
          retention-days: 1
          include-hidden-files: true

  # The API's coverage number, assembled from the jobs that each measured part of it (B-016).
  evals:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.api }}
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/charie
      APP_DATABASE_URL: postgresql+asyncpg://charie_app:apptest@localhost:5432/charie
      APP_DB_PASSWORD: apptest
      # The fixture's own database, on the same server.
      SEED_PIZZA_HOST: localhost
      SEED_PIZZA_PORT: "5432"
      SEED_PIZZA_DB: pizza
      SEED_PIZZA_USER: postgres
      SEED_PIZZA_PASSWORD: test
      SEED_PIZZA_READONLY_USER: pizza_readonly
      SEED_PIZZA_READONLY_PASSWORD: evalsreadonly
      # Both databases are on this runner.
      TLS_LOCAL_HOSTS: localhost
      SECRETS_BACKEND: local
      LOCAL_SECRETS_PATH: ${{ github.workspace }}/ops/.secrets/evals.json
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install
        if: env.RUN == 'true'
        run: uv sync --locked --directory apps/api
      - name: A key for the local secrets store
        if: env.RUN == 'true'
        run: |
          mkdir -p ops/.secrets
          echo "LOCAL_SECRETS_KEY=$(uv run --directory apps/api python -c             'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"             >> "$GITHUB_ENV"
      - name: The platform database
        if: env.RUN == 'true'
        run: |
          psql "postgresql://postgres:test@localhost:5432/postgres"             -c "CREATE DATABASE charie"
          uv run --directory apps/api alembic upgrade head
          psql "postgresql://postgres:test@localhost:5432/charie"             -c "ALTER ROLE charie_app WITH LOGIN PASSWORD 'apptest'"
      # The same generator `make seed` runs, so the numbers here are the numbers in truths.json.
      - name: The pizza fixture
        if: env.RUN == 'true'
        run: |
          psql "postgresql://postgres:test@localhost:5432/postgres"             -c "CREATE DATABASE pizza"
          uv run ops/seed/seed_pizza.py
      - name: An organization, a registered source and its catalog
        if: env.RUN == 'true'
        run: |
          uv run --directory apps/api python ../../ops/evals/provision.py | tee /tmp/provision.log
          grep '^EVALS_ORG_ID=' /tmp/provision.log >> "$GITHUB_ENV"
      - name: The twenty golden questions
        if: env.RUN == 'true'
        run: make evals
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No API or ops changes; the evals did not need to run."

  coverage:
    needs: [api, mssql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Collect what each job measured
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: apps/api/coverage-data
      - name: Combine the shards and apply the floor
        run: bash scripts/coverage_report.sh

  web:
    needs: changes
    runs-on: ubuntu-latest
    # Bounded, because an unbounded step here has already cost two hours.
    timeout-minutes: 20
    env:
      RUN: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: env.RUN == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        if: env.RUN == 'true'
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Lint, typecheck, test
        if: env.RUN == 'true'
        run: make lint.web typecheck.web test.web
      - name: Build
        if: env.RUN == 'true'
        run: pnpm --dir apps/web build
      # A real browser, because a jsdom test passed against code the browser visibly broke on.
      - name: Install Chromium
        if: env.RUN == 'true'
        # No `--with-deps`, deliberately.
        timeout-minutes: 8
        run: pnpm --dir apps/web exec playwright install chromium
      - name: Browser smoke
        if: env.RUN == 'true'
        run: make test.web.e2e
      - name: Keep the trace of a failure
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No changes under apps/web — skipping."

  # The whole product, in a browser, on a real compose stack (plan WP11.2b).
  web-e2e:
    needs: changes
    runs-on: ubuntu-latest
    # The observed cold run on a developer machine is ~3 minutes.
    timeout-minutes: 30
    env:
      RUN: ${{ needs.changes.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v4
        if: env.RUN == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        if: env.RUN == 'true'
        run: |
          uv sync --locked --directory apps/api
          pnpm --dir apps/web install --frozen-lockfile
      # No `--with-deps`, for the reason the `web` job gives at length.
      - name: Install Chromium
        if: env.RUN == 'true'
        timeout-minutes: 8
        run: pnpm --dir apps/web exec playwright install chromium
      # The stack's configuration, which on a developer's machine is a file they own.
      - name: A .env for the stack
        if: env.RUN == 'true'
        run: |
          cp .env.example .env
          {
            echo "LOCAL_SECRETS_KEY=$(uv run --directory apps/api python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          } >> .env
      # The script prints the api and web logs itself when the walk fails.
      - name: The walk
        if: env.RUN == 'true'
        run: make test.web.smoke
      - name: Keep the trace of a failure
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No changes under apps/web or apps/api — the smoke did not need to run."

  # The deployment, compiled (plan WP12.1).
  infra:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN: ${{ needs.changes.outputs.infra }}
      # Obvious dummies, and deliberately not plausible ones.
      POSTGRES_ADMIN_PASSWORD: lint-only-not-a-password
      BUDGET_ALERT_EMAIL: lint@example.invalid
    steps:
      - uses: actions/checkout@v4
      # Through the Makefile, so `make build.infra` and this job are the same command.
      - name: Compile every module and both parameter files
        if: env.RUN == 'true'
        run: make build.infra
      # Its own file with its own selftest, like every other guard here.
      - name: The infra secret guard still catches one
        if: env.RUN == 'true'
        run: bash scripts/check_infra_secrets.sh --selftest
      - name: No secret value is written into a template
        if: env.RUN == 'true'
        run: bash scripts/check_infra_secrets.sh
      - name: Nothing to do
        if: env.RUN != 'true'
        run: echo "No changes under infra/ — skipping."

  # Proves both images still build. Pushing them arrives with Phase 12.
  docker:
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build --target prod --build-arg GIT_SHA=${{ github.sha }} -t api:ci apps/api
      # A placeholder, and it must be one that can never resolve (B-132).
      - name: Build the web image
        run: docker build --target prod --build-arg NEXT_PUBLIC_API_URL=https://api.ci.invalid -t web:ci apps/web
