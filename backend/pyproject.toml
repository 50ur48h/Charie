[project]
name = "charie"
version = "0.1.0"
description = "Charie: an AI data and business analyst"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "openai>=3.41.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "sqlglot>=30.26.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charie"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008 flags FastAPI's Depends() in defaults, which every address uses.
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "practice_db: needs the practice database on this laptop",
    "live_ai: makes a real AI call; costs money",
]
