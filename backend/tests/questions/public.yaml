      - name: no.1
        value: '746765.4600'
        tolerance: 1
      - name: no.2
        value: '585203.1800'
        tolerance: 1
    must_say:
      - Indian
      - Breakfast
    must_not_say: []
    should_ask: false
  answer_key_sql: SELECT ROUND((SELECT SUM(o.total_amount - o.tax_amount - o.delivery_fee) FROM public.orders o JOIN public.restaurants r ON r.id = o.restaurant_id JOIN public.restaurant_cuisines rc ON rc.restaurant_id = r.id JOIN public.cuisine_types t ON t.id = rc.cuisine_type_id WHERE o.created_at >= DATE '2025-10-01' AND o.created_at < DATE '2026-01-01' GROUP BY t.name ORDER BY 1 DESC LIMIT 1)::numeric, 4), ROUND((SELECT SUM(o.total_amount - o.tax_amount - o.delivery_fee) FROM public.orders o JOIN public.restaurants r ON r.id = o.restaurant_id JOIN public.restaurant_cuisines rc ON rc.restaurant_id = r.id JOIN public.cuisine_types t ON t.id = rc.cuisine_type_id WHERE o.created_at >= DATE '2025-10-01' AND o.created_at < DATE '2026-01-01' GROUP BY t.name ORDER BY 1 DESC LIMIT 1 OFFSET 1)::numeric, 4)
  checked_by: Muse Code, 2026-10-30
  why_fair: Top 2 is a plain ranking; net sales is the house meaning.
