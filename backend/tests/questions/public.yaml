- id: vague-004
  kind: vague
  smoke: false
  chat: []
  question: How much have sales grown this year?
  expect:
    numbers:
      - name: 2025 net sales
        value: '13503213.3600'
        tolerance: 1
      - name: 2024 net sales
        value: '8188255.6600'
        tolerance: 1
      - name: change
        value: '64.9095'
        tolerance: '0.01'
    must_say:
      - I read this as
      - '2024'
    must_not_say: []
    should_ask: false
  answer_key_sql: SELECT ROUND(SUM(CASE WHEN o.created_at >= DATE '2025-01-01' THEN o.total_amount - o.tax_amount - o.delivery_fee END)::numeric, 4), ROUND(SUM(CASE WHEN o.created_at < DATE '2025-01-01' THEN o.total_amount - o.tax_amount - o.delivery_fee END)::numeric, 4), ROUND(((SUM(CASE WHEN o.created_at >= DATE '2025-01-01' THEN o.total_amount - o.tax_amount - o.delivery_fee END) - SUM(CASE WHEN o.created_at < DATE '2025-01-01' THEN o.total_amount - o.tax_amount - o.delivery_fee END)) / SUM(CASE WHEN o.created_at < DATE '2025-01-01' THEN o.total_amount - o.tax_amount - o.delivery_fee END) * 100)::numeric, 4) FROM public.orders o WHERE o.created_at >= DATE '2024-01-01' AND o.created_at < DATE '2026-01-01'
  checked_by: Muse Code, 2026-10-30
  why_fair: Both years are complete; the change is in percentage points.
# naive answer: 3343167.23 (the join counts orders with 2+ items over $15 twice)
- id: trap-001
  kind: trap
  smoke: true
  chat: []
  question: In Q4 2025, how much did customers spend in total on orders that included at least one item priced over $15?
  expect:
    numbers:
      - name: gross sales
        value: '2321980.9100'
        tolerance: '0.005'
      - name: orders
        value: 27557
        tolerance: '0.005'
    must_say: []
    must_not_say: []
    should_ask: false
  answer_key_sql: SELECT ROUND(SUM(o.total_amount)::numeric, 4), COUNT(*) FROM public.orders o WHERE o.created_at >= DATE '2025-10-01' AND o.created_at < DATE '2026-01-01' AND o.id IN (SELECT i.order_id FROM public.order_items i WHERE i.unit_price > 15)
  checked_by: Muse Code, 2026-10-30
  why_fair: $15 is the nearest whole $5 to $20 with 20-80% of Q4 2025 orders qualifying (38.1%); the naive join double-counts.
