  answer_key_sql: SELECT ROUND((SUM(qty_used) / 1000)::numeric, 4) FROM charie.order_ingredient_usage WHERE ingredient_id = 1 AND usage_date >= DATE '2025-07-01' AND usage_date < DATE '2025-08-01'
