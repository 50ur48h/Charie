- id: trap-004
  kind: trap
  smoke: false
  chat: []
  question: How much mozzarella did we use in July 2025?
  expect:
    numbers:
      - name: mozzarella kg
        value: '1119.6525'
        tolerance: '0.005'
    must_say:
      - estimate
    must_not_say: []
