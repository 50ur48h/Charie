  answer_key_sql: SELECT ROUND((SELECT SUM(o.total_amount - o.tax_amount - o.delivery_fee) FROM public.orders o JOIN public.restaurants r ON r.id = o.restaurant_id WHERE o.created_at >= DATE '2025-01-01' AND o.created_at < DATE '2026-01-01' GROUP BY r.name ORDER BY 1 DESC LIMIT 1)::numeric, 4), ROUND((SELECT SUM(o.total_amount - o.tax_amount - o.delivery_fee) FROM public.orders o JOIN public.restaurants r ON r.id = o.restaurant_id WHERE o.created_at >= DATE '2025-01-01' AND o.created_at < DATE '2026-01-01' GROUP BY r.name ORDER BY 1 DESC LIMIT 1 OFFSET 4)::numeric, 4)
