# Muse Code's public test questions. Format: docs/architecture/08-testing-plan.md.
#
# Meanings the answer keys use (the owner notes; Phase 9 checks the learner
# against these, so they never bend to make a key easier):
# 1. Completed orders: `delivered` is the only order status; there are no
#    cancelled or failed rows to leave out.
# 2. Dates come from `public.orders.created_at`, which has no time zone.
# Dates: as stored
# 3. Net sales (what "sales" means) = SUM(total_amount - tax_amount - delivery_fee):
#    food and drink after coupon discounts. Gross sales = SUM(total_amount),
#    which keeps tax and delivery fees. Orders = count. Average order value =
#    net sales divided by orders. Items sold = SUM(order_items.quantity).
# 4. Periods: calendar months and quarters; weeks run Monday to Sunday.
#    "Today" is Wed 31 Dec 2025 (the last day of data), "this year" is 2025,
#    and "this week" is 29-31 Dec 2025 (only 3 days).
# 5. Cuisines come through `public.restaurant_cuisines`; a restaurant with
#    2 cuisines counts fully under each.
# 6. Mozzarella use is `charie.order_ingredient_usage` (grams, so kg = sum / 1000),
#    a recipe-based estimate; waste from `charie.waste_events` is never added.
# 7. Percentages are percentage points: 6.2 means 6.2%, as in 09's chart values.
- id: clear-001
  kind: clear
  smoke: true
  chat: []
  question: How many orders did we have in December 2025, and what were net sales?
  expect:
    numbers:
      - name: orders
        value: 25064
        tolerance: 2
      - name: net sales
        value: '1354004.6300'
        tolerance: 1
    must_say:
      - Dec 2025
    must_not_say: []
    should_ask: false
  answer_key_sql: SELECT COUNT(*), ROUND(SUM(o.total_amount - o.tax_amount - o.delivery_fee)::numeric, 4) FROM public.orders o WHERE o.created_at >= DATE '2025-12-01' AND o.created_at < DATE '2026-01-01'
  checked_by: Muse Code, 2026-10-30
  why_fair: A plain count and sum over a full month.
- id: clear-002
  kind: clear
  smoke: true
  chat: []
  question: Net sales by cuisine for Q4 2025
  expect:
