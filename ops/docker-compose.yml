# Local development stack (plan WP0.4, architecture Part 9.2).

name: charie

services:
  # The platform's own database: tenants, catalog, runs, events, pgvector.
  platform-pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:-charie}
      POSTGRES_USER: ${PLATFORM_DB_USER:-charie}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
    ports:
      - "${PLATFORM_DB_PORT:-5432}:5432"
    volumes:
      - platform-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${PLATFORM_DB_USER:-charie} -d ${PLATFORM_DB_NAME:-charie}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A stand-in for a customer's database.
  seed-pizza-pg:
    profiles: ["test-fixtures"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${SEED_PIZZA_DB:-pizza}
      POSTGRES_USER: ${SEED_PIZZA_USER:-pizza}
      POSTGRES_PASSWORD: ${SEED_PIZZA_PASSWORD:-local_fixture_only}
    ports:
      - "${SEED_PIZZA_PORT:-6543}:5432"
    volumes:
      - seed-pizza-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEED_PIZZA_USER:-pizza} -d ${SEED_PIZZA_DB:-pizza}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ../apps/api
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      ENV: local
      GIT_SHA: ${GIT_SHA:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Explicit, because the default is the stricter mode.
      AUTH_MODE: ${AUTH_MODE:-dev}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-charie-api}
      DEV_ISSUER_URL: ${DEV_ISSUER_URL:-http://localhost:8000/dev}
      # Where to fetch the provider's discovery document.
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-}
      # The optional pin for the expected `iss`.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      # Built from the same parts as the root DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://${PLATFORM_DB_USER:-charie}:${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}@platform-pg:5432/${PLATFORM_DB_NAME:-charie}
      # What the request path actually connects as: no superuser, no BYPASSRLS.
      APP_DATABASE_URL: postgresql+asyncpg://charie_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@platform-pg:5432/${PLATFORM_DB_NAME:-charie}
      # Data-source credentials (DECISIONS D-001).
      SECRETS_BACKEND: ${SECRETS_BACKEND:-local}
      LOCAL_SECRETS_KEY: ${LOCAL_SECRETS_KEY:-}
      LOCAL_SECRETS_PATH: /app/ops/.secrets/secrets.json
      # The Azure halves of the two stores (WP12.2).
      KEY_VAULT_URL: ${KEY_VAULT_URL:-}
      ARTIFACTS_BACKEND: ${ARTIFACTS_BACKEND:-local}
      ARTIFACTS_ACCOUNT_URL: ${ARTIFACTS_ACCOUNT_URL:-}
      ARTIFACTS_CONTAINER: ${ARTIFACTS_CONTAINER:-artifacts}
      # Encryption to customer databases (B-013).
      TLS_LOCAL_HOSTS: ${TLS_LOCAL_HOSTS:-}
      TLS_MODE: ${TLS_MODE:-require}
      TLS_MODE_LOCAL: ${TLS_MODE_LOCAL:-prefer}
      TLS_CA_FILE: ${TLS_CA_FILE:-}
      # The model configuration, which this container had none of until Phase 7 put a chat UI in...
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      LLM_MODELS: ${LLM_MODELS:-}
      LLM_ROLE_MAP: ${LLM_ROLE_MAP:-}
      LLM_SELECTABLE_MODELS: ${LLM_SELECTABLE_MODELS:-}
      DEMO_ORG: ${DEMO_ORG:-}
      LLM_PRICES: ${LLM_PRICES:-}
      LLM_RUN_COST_LIMIT_USD: ${LLM_RUN_COST_LIMIT_USD:-}
      # What a run does when the cap is on and a model has no price.
      LLM_REFUSE_UNPRICED_WHEN_CAPPED: ${LLM_REFUSE_UNPRICED_WHEN_CAPPED:-}
      # Meta Model API, for LLM_PROVIDERS=meta (D-069).
      META_API_KEY: ${META_API_KEY:-}
      # Passed for B-086's reason: an effort tuned on the host and not here would be measured by...
      META_REASONING_EFFORT: ${META_REASONING_EFFORT:-}
      # The DAL's caps, which decide what a query is allowed to cost the customer's database.
      DAL_MAX_ROWS: ${DAL_MAX_ROWS:-}
      DAL_TIMEOUT_SECONDS: ${DAL_TIMEOUT_SECONDS:-}
      # How long a stored result lives.
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source only: never mount over /app/.venv, which is built into the image.
      - ../apps/api/src:/app/src
      # The encrypted secrets file, on the host and gitignored.
      - ../ops/.secrets:/app/ops/.secrets
      # Where query results are written (ARTIFACTS_PATH, default ops/artifacts).
      - ../ops/artifacts:/app/ops/artifacts
    depends_on:
      platform-pg:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ../apps/web
      target: dev
    environment:
      # The browser resolves these, not the container, so they are host URLs.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Which environment this bundle thinks it is in.
      NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-local}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
      NEXT_PUBLIC_ENTRA_AUTHORITY: ${NEXT_PUBLIC_ENTRA_AUTHORITY:-}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_CLIENT_ID:-}
      NEXT_PUBLIC_API_SCOPE: ${NEXT_PUBLIC_API_SCOPE:-}
      # Bind mounts on Windows and macOS do not deliver inotify events.
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web/src:/app/src
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # `next dev` compiles on first request, so this probe is also what warms the page.
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Started on demand (`make up.mssql`): the image is ~1.5 GB and idles on ~2 GB of RAM.
  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Defaulted, not required.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_dev_only_1}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd ships inside the image, at a path that moved in 2022. -C trusts the server's...
      test:
        ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      # SQL Server takes its time on first boot.
      start_period: 60s

volumes:
  platform-pg-data:
  seed-pizza-data:
  mssql-data:
