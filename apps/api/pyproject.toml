[project]
name = "charie"
version = "0.1.0"
description = "AI-native data analysis platform — API, agent runtime, DAL, connectors"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # orjson is deliberately absent — see DECISIONS D-005.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # SQL Server, through unixODBC and Microsoft's msodbcsql18 driver, which the image installs.
    "pyodbc>=5.2",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pydantic[email]>=2.13.4",
    # Fernet, for the local secrets backend (DECISIONS D-001).
    "cryptography>=44.0",
    "sqlglot>=30.17.0",
    # pgvector's SQLAlchemy type, so `knowledge_chunks.embedding` is a column the ORM and the...
    "pgvector>=0.3.6",
    # A PDF's text layer (WP10.1a). pypdf, not pymupdf, which architecture 5.5 named.
    "pypdf>=5.1",
    # FastAPI needs it to parse a multipart upload.
    "python-multipart>=0.0.20",
    # Azure, for the two backends that replace the local ones in a deployment.
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-storage-blob>=12.24",
    # `azure-core[aio]`, not bare `azure-core`, and a test is why.
    "azure-core[aio]>=1.30",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.3",
    "hypothesis>=6.165.5",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charie"]

# --- ruff — lint + format ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ASYNC",# async correctness — this codebase is async end to end
    "S",    # bandit security rules
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of a test
    "S608",  # test SQL is built from module constants, never from input
]
# Migrations are DDL assembled from constants in the file itself.
"src/charie/db/alembic/versions/*" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["charie"]

# --- pyright — strict ---
[tool.pyright]
include = ["src", "tests"]
# `ops/evals` is where the eval harness lives, and `tests/evals` imports its checking half directly.
extraPaths = ["../../ops/evals"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "rls_proof: tenant-isolation proof tests — may never be skipped (plan §4.4)",
    "live_provider: may obtain a non-stub provider, and so may spend real money (B-040)",
]

[tool.coverage.run]
source = ["src/charie"]
branch = true
# The suite is measured in more than one CI job — one has Postgres, one has SQL Server.
relative_files = true
# SQLAlchemy's asyncio layer runs awaited database work inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
