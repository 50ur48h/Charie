# What the secret scanner may ignore, and why each one.

[extend]
useDefault = true

[[rules]]
# Keep the default rule; this block only carries the allowlist below.
id = "generic-api-key"

[allowlist]
description = "Public constants, the published demo login, and the fixtures a guard needs to test itself"

regexes = [
  # Azure built-in role definition ids.
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',  # Key Vault Secrets Officer
  '''ba92f5b4-2d11-453d-a403-e96b0029c9fe''',  # Storage Blob Data Contributor
  '''7f951dda-4ed3-4680-a7ca-43fe172d538d''',  # AcrPull
  # Published on purpose: the read-only login to the synthetic demo database (docker-compose.yml).
  '''TT284Cy_lwnKvLjPUukGWXGXQvN5q31C''',
  # Local-only passwords for the demo's own throwaway Postgres container.
  '''charie_demo_local_only''',
  '''charie_app_demo_local_only''',
]
